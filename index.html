<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
  <link rel="apple-touch-icon" href="balade-bordeaux.png">
<link rel="icon" href="balade-bordeaux.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Balades Bordeaux">
<title>Balades à Bordeaux</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  body { font-family: system-ui; background: #f5f1ea; color: #2b2320; margin: 0; }
  header { background: #7a1f3d; color: #fff; padding: 14px 16px 10px; }
  header h1 { margin: 0 0 10px; font-size: 1.3em; }
  .choix { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .choix button { flex: 0 0 auto; background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.35);
                  border-radius: 20px; padding: 8px 14px; font-size: 0.95em; }
  .choix button.actif { background: #fff; color: #7a1f3d; font-weight: 700; }
  .resume { font-size: 0.95em; margin-top: 10px; opacity: 0.95; }
  #carte { height: 52vh; }
  .suivi { padding: 12px 16px; background: #fff; border-bottom: 1px solid #e5ddd0; display: flex; flex-wrap: wrap; gap: 8px; }
  .suivi button { flex: 1; background: #7a1f3d; color: #fff; border: none; border-radius: 12px; padding: 12px; font-size: 1em; }
  .suivi button.actif { background: #2e7d32; }
  .suivi button.secondaire { flex: 0 0 auto; background: #e5ddd0; color: #2b2320; }
  #prochaine { flex-basis: 100%; font-size: 1.05em; }
  .etapes { padding: 8px 16px 30px; }
  .etape { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid #e5ddd0; cursor: pointer; }
  .num { flex: 0 0 34px; height: 34px; border-radius: 50%; background: #7a1f3d; color: #fff;
         display: flex; align-items: center; justify-content: center; font-weight: 700; }
  .etape.vue .num { background: #2e7d32; }
  .etape h3 { margin: 0 0 4px; font-size: 1.05em; }
  .etape p { margin: 0; font-size: 0.9em; color: #5a4d46; }
  .etape .dist { font-size: 0.8em; color: #7a1f3d; margin-top: 4px; font-weight: 600; }
  .marqueur { background: #7a1f3d; color: #fff; border: 2px solid #fff; border-radius: 50%; width: 28px; height: 28px;
              display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px;
              box-shadow: 0 2px 5px rgba(0,0,0,.35); }
  .marqueur.vue { background: #2e7d32; }
  .credits { font-size: 0.75em; color: #8a7d74; padding: 0 16px 20px; }
</style>
</head>
<body>

<header>
  <h1>Balades à Bordeaux</h1>
  <div class="choix" id="choix"></div>
  <div class="resume" id="resume">Calcul du parcours…</div>
</header>

<div id="carte"></div>

<div class="suivi">
  <button id="btnSuivi">📍 Suivre ma position</button>
  <button id="btnReset" class="secondaire">↺ Recommencer</button>
  <div id="prochaine"></div>
</div>

<div class="etapes" id="etapes"></div>
<div class="credits">Carte © IGN · Itinéraire piéton © OpenStreetMap / FOSSGIS · Coordonnées approximatives</div>

<script>
// ===== LES BALADES : pour chaque étape [nom, latitude, longitude, description] =====
const BALADES = [
  { nom: "Le cœur (courte)", etapes: [
    ["Grand-Théâtre", 44.8425, -0.5743, "Chef-d'œuvre néoclassique de Victor Louis, inauguré en 1780, et sa façade aux douze colonnes."],
    ["Place de la Bourse & Miroir d'eau", 44.8414, -0.5698, "Place royale du XVIIIᵉ siècle. Le Miroir d'eau, créé en 2006, reflète les façades."],
    ["Place du Parlement", 44.8404, -0.5717, "Petite place du XVIIIᵉ siècle aux belles façades, idéale pour une pause en terrasse."],
    ["Porte Cailhau", 44.8391, -0.5694, "Porte fortifiée de 1495, élevée en l'honneur de la victoire de Fornoue."],
    ["Grosse Cloche", 44.8356, -0.5724, "Beffroi de l'ancien hôtel de ville, l'un des plus anciens de France."],
    ["Cathédrale Saint-André & Tour Pey-Berland", 44.8378, -0.5779, "Cathédrale gothique et son clocher séparé du XVᵉ siècle, qu'on peut gravir pour la vue."],
  ]},
  { nom: "Le Bordeaux historique", etapes: [
    ["Jardin Public", 44.8485, -0.5790, "Jardin du XVIIIᵉ siècle réaménagé à l'anglaise, avec ses bassins, son kiosque et le Muséum."],
    ["Esplanade des Quinconces", 44.8446, -0.5728, "L'une des plus grandes places d'Europe, dominée par le monument aux Girondins et ses fontaines."],
    ["Grand-Théâtre", 44.8425, -0.5743, "Chef-d'œuvre néoclassique de Victor Louis, inauguré en 1780."],
    ["Place de la Bourse & Miroir d'eau", 44.8414, -0.5698, "Place royale du XVIIIᵉ siècle et son célèbre Miroir d'eau."],
    ["Place du Parlement", 44.8404, -0.5717, "Petite place du XVIIIᵉ siècle, idéale pour une pause en terrasse."],
    ["Porte Cailhau", 44.8391, -0.5694, "Porte fortifiée de 1495, élevée en l'honneur de la victoire de Fornoue."],
    ["Pont de pierre", 44.8378, -0.5654, "Premier pont de Bordeaux sur la Garonne, voulu par Napoléon et achevé en 1822."],
    ["Basilique Saint-Michel", 44.8347, -0.5663, "Basilique gothique et sa flèche isolée de 114 m, l'une des plus hautes du sud de la France."],
    ["Grosse Cloche", 44.8356, -0.5724, "Beffroi de l'ancien hôtel de ville, l'un des plus anciens de France."],
    ["Cathédrale Saint-André & Tour Pey-Berland", 44.8378, -0.5779, "Cathédrale gothique et son clocher séparé du XVᵉ siècle."],
    ["Palais Rohan", 44.8373, -0.5790, "Ancien palais des archevêques du XVIIIᵉ siècle, aujourd'hui l'hôtel de ville."],
  ]},
  { nom: "Chartrons & Cité du Vin", etapes: [
    ["Esplanade des Quinconces", 44.8446, -0.5728, "Point de départ, face au monument aux Girondins."],
    ["Rue Notre-Dame", 44.8515, -0.5720, "Rue des antiquaires et des brocanteurs, au cœur de l'ancien quartier des négociants en vin."],
    ["Église Saint-Louis des Chartrons", 44.8547, -0.5741, "Église néogothique du XIXᵉ siècle, repère du quartier des Chartrons."],
    ["Quai des Chartrons", 44.8540, -0.5675, "Promenade le long de la Garonne, bordée d'anciennes demeures de négociants."],
    ["Bassins à flot", 44.8655, -0.5590, "Anciens bassins portuaires du XIXᵉ siècle, aujourd'hui quartier en pleine renaissance."],
    ["Cité du Vin", 44.8625, -0.5503, "Musée consacré aux cultures du vin, ouvert en 2016, à l'architecture spectaculaire en forme de carafe."],
  ]},
  { nom: "La rive droite", etapes: [
    ["Place de la Bourse", 44.8414, -0.5698, "Départ face au Miroir d'eau, avant de traverser la Garonne."],
    ["Pont de pierre", 44.8385, -0.5625, "Traversée par le pont historique de 1822 : belle vue sur les façades des quais."],
    ["Place Stalingrad", 44.8410, -0.5595, "Place de la Bastide et son célèbre Lion bleu, une œuvre de Xavier Veilhan."],
    ["Jardin botanique de la Bastide", 44.8440, -0.5560, "Jardin botanique contemporain, avec ses cultures, ses milieux naturels et ses serres."],
    ["Darwin", 44.8497, -0.5605, "Ancienne caserne militaire transformée en lieu alternatif : street art, skatepark, épicerie bio."],
    ["Quai de la rive droite", 44.8540, -0.5580, "Promenade avec vue sur la façade des quais et le Pont Chaban-Delmas."],
  ]},
];
// =====================================================================================

const RAYON_VISITE = 40;   // mètres
const VITESSE = 4.5;       // km/h

const km = m => m < 1000 ? Math.round(m) + " m" : (m / 1000).toFixed(1).replace(".", ",") + " km";
const duree = m => { const min = Math.round(m / 1000 / VITESSE * 60); return min < 60 ? min + " min" : Math.floor(min / 60) + " h " + String(min % 60).padStart(2, "0"); };

function distance(a, b) {
  const R = 6371000, rad = x => x * Math.PI / 180;
  const dLat = rad(b[0] - a[0]), dLon = rad(b[1] - a[1]);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a[0])) * Math.cos(rad(b[0])) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

// ===================== ÉTAT =====================
let choix = 0;
try { choix = Number(localStorage.getItem("baladeChoix")) || 0; } catch (e) {}
if (choix >= BALADES.length) choix = 0;
let vues = new Set(), distancesEtapes = [], marqueurs = [];
const etapes = () => BALADES[choix].etapes;

function chargerVues() {
  try { vues = new Set(JSON.parse(localStorage.getItem("baladeVues_" + choix) || "[]")); } catch (e) { vues = new Set(); }
}
function sauverVues() {
  try { localStorage.setItem("baladeVues_" + choix, JSON.stringify([...vues])); } catch (e) {}
}

// ===================== CARTE =====================
const carte = L.map("carte").setView([44.845, -0.570], 14);
L.tileLayer("https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0"
  + "&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&STYLE=normal&TILEMATRIXSET=PM&FORMAT=image/png"
  + "&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}", { maxZoom: 19, attribution: "© IGN" }).addTo(carte);
const calqueParcours = L.layerGroup().addTo(carte);
const calqueEtapes = L.layerGroup().addTo(carte);

const icone = (i, vue) => L.divIcon({ className: "", iconSize: [28, 28], iconAnchor: [14, 14],
  html: `<div class="marqueur ${vue ? "vue" : ""}">${i + 1}</div>` });

// ===================== CHOIX DE LA BALADE =====================
function afficherChoix() {
  document.getElementById("choix").innerHTML = BALADES.map((b, i) =>
    `<button class="${i === choix ? "actif" : ""}" onclick="choisir(${i})">${b.nom}</button>`).join("");
}

function choisir(i) {
  choix = i;
  try { localStorage.setItem("baladeChoix", i); } catch (e) {}
  afficherBalade();
}

function afficherBalade() {
  afficherChoix();
  chargerVues();
  calqueEtapes.clearLayers();
  calqueParcours.clearLayers();
  marqueurs = etapes().map(([nom, lat, lon, desc], i) =>
    L.marker([lat, lon], { icon: icone(i, vues.has(i)) })
      .bindPopup(`<b>${i + 1}. ${nom}</b><br>${desc}`)
      .addTo(calqueEtapes));
  carte.fitBounds(etapes().map(e => [e[1], e[2]]), { padding: [30, 30] });
  document.getElementById("resume").textContent = "Calcul du parcours…";
  document.getElementById("prochaine").textContent = "";
  tracerParcours(choix);
}

// ===================== ITINÉRAIRE À PIED =====================
async function tracerParcours(numero) {
  const pts = etapes().map(e => [e[1], e[2]]);
  try {
    const url = "https://routing.openstreetmap.de/routed-foot/route/v1/driving/"
              + etapes().map(e => e[2] + "," + e[1]).join(";") + "?overview=full&geometries=geojson";
    const data = await (await fetch(url)).json();
    if (numero !== choix) return;                     // l'utilisateur a changé de balade entre-temps
    const route = data.routes[0];
    L.geoJSON(route.geometry, { style: { color: "#7a1f3d", weight: 5, opacity: 0.75 } }).addTo(calqueParcours);
    distancesEtapes = [0, ...route.legs.map(l => l.distance)];
    document.getElementById("resume").textContent =
      `${pts.length} étapes · ${km(route.distance)} à pied · environ ${duree(route.distance)} de marche`;
  } catch (e) {
    if (numero !== choix) return;
    L.polyline(pts, { color: "#7a1f3d", weight: 4, dashArray: "6 8" }).addTo(calqueParcours);
    distancesEtapes = [0, ...pts.slice(1).map((p, i) => distance(pts[i], p) * 1.3)];
    const total = distancesEtapes.reduce((a, b) => a + b, 0);
    document.getElementById("resume").textContent =
      `${pts.length} étapes · environ ${km(total)} · ${duree(total)} de marche (estimation)`;
  }
  afficherListe();
}

function afficherListe() {
  let cumul = 0;
  document.getElementById("etapes").innerHTML = etapes().map(([nom, , , desc], i) => {
    cumul += distancesEtapes[i] || 0;
    const info = i === 0 ? "Départ" : `+ ${km(distancesEtapes[i] || 0)} · total ${km(cumul)}`;
    return `<div class="etape ${vues.has(i) ? "vue" : ""}" onclick="allerA(${i})">
      <div class="num">${vues.has(i) ? "✓" : i + 1}</div>
      <div><h3>${nom}</h3><p>${desc}</p><div class="dist">${info}</div></div>
    </div>`;
  }).join("");
}

function allerA(i) {
  carte.setView([etapes()[i][1], etapes()[i][2]], 17);
  marqueurs[i].openPopup();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function marquerVue(i) {
  vues.add(i);
  sauverVues();
  marqueurs[i].setIcon(icone(i, true));
  afficherListe();
}

document.getElementById("btnReset").onclick = () => {
  if (!confirm("Remettre à zéro les étapes de cette balade ?")) return;
  vues = new Set();
  sauverVues();
  afficherBalade();
};

// ===================== SUIVI GPS =====================
let suiviId = null, pointMoi = null;

document.getElementById("btnSuivi").onclick = () => {
  const btn = document.getElementById("btnSuivi");
  if (suiviId !== null) {
    navigator.geolocation.clearWatch(suiviId);
    suiviId = null;
    btn.classList.remove("actif");
    btn.textContent = "📍 Suivre ma position";
    return;
  }
  if (!navigator.geolocation) { alert("La localisation n'est pas disponible sur cet appareil."); return; }
  btn.classList.add("actif");
  btn.textContent = "⏹ Arrêter le suivi";
  suiviId = navigator.geolocation.watchPosition(majPosition,
    err => { document.getElementById("prochaine").textContent = "Localisation impossible : " + err.message; },
    { enableHighAccuracy: true, maximumAge: 5000 });
};

function majPosition(pos) {
  const moi = [pos.coords.latitude, pos.coords.longitude];
  if (!pointMoi) {
    pointMoi = L.circleMarker(moi, { radius: 9, color: "#fff", weight: 3, fillColor: "#1e6fff", fillOpacity: 1 }).addTo(carte);
    carte.setView(moi, 16);
  } else {
    pointMoi.setLatLng(moi);
  }
  etapes().forEach((e, i) => { if (!vues.has(i) && distance(moi, [e[1], e[2]]) < RAYON_VISITE) marquerVue(i); });

  const i = etapes().findIndex((e, k) => !vues.has(k));
  const zone = document.getElementById("prochaine");
  if (i === -1) { zone.innerHTML = "🎉 Balade terminée, bravo !"; return; }
  const d = distance(moi, [etapes()[i][1], etapes()[i][2]]);
  zone.innerHTML = `Prochaine étape : <b>${i + 1}. ${etapes()[i][0]}</b><br>à ${km(d)} à vol d'oiseau (≈ ${duree(d * 1.3)})`;
}

afficherBalade();
</script>
</body>
</html>
